# The iOS app (iPhone and iPad): a thin Swift shell around the shared Kotlin code in android/app
# (commonMain + iosMain), which Gradle builds into ComposeApp.framework during the Xcode build.
# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: DIPFieldService
options:
  bundleIdPrefix: com.meterreading
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "7"
    # First values only (as Android's -P options); the supervisor changes them in Settings.
    MR_API_BASE_URL: "https://zApps.dipark.com/"
    MR_USE_FAKE_DATA: "NO"
    MR_READER_LOGIN: ""
    MR_DEVICE_LOCK: "YES"
    MR_SETTINGS_PIN: ""
targets:
  DIPFieldService:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: DIP Field Service
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        # iPhone: portrait, as on Android. iPad: every way round.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Compose draws at the screen's full refresh rate.
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Take photos of meters and units, kept with the reading or inspection as evidence.
        NSLocationWhenInUseUsageDescription: Keep where you are with an inspection visit, when you say you are at the property.
        NSFaceIDUsageDescription: Open DIP Field Service with your face, as you open your phone.
        # Only standard encryption (HTTPS, the Keychain): no export paperwork.
        ITSAppUsesNonExemptEncryption: false
        # https only, except a development server on this computer or network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        MRApiBaseUrl: $(MR_API_BASE_URL)
        MRUseFakeData: $(MR_USE_FAKE_DATA)
        MRReaderLogin: $(MR_READER_LOGIN)
        MRDeviceLock: $(MR_DEVICE_LOCK)
        MRSettingsPin: $(MR_SETTINGS_PIN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meterreading.reader
        PRODUCT_NAME: DIPFieldService
        # 1 = iPhone, 2 = iPad: one app for both.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../android/app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, ComposeApp]
    preBuildScripts:
      - name: Build the shared Kotlin code
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../android"
          ./gradlew :app:embedAndSignAppleFrameworkForXcode
