# Pictures of the meter-reading screens with the demo data, for guides and reviews.
# Runs by hand (Actions → Android screenshots → Run workflow) or when the screenshot code changes.
# The PNGs are attached to the run and pushed to the branch "screenshots" (folder android/).
name: Android screenshots

on:
  push:
    paths:
      - 'android/app/src/test/java/com/meterreading/reader/screenshots/**'
      - '.github/workflows/android-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the pictures
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest -Pscreenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: android/app/build/screenshots/*.png
          if-no-files-found: warn

      - name: Push to the screenshots branch
        run: |
          SRC="$PWD/app/build/screenshots"
          ls "$SRC"/*.png
          SHA=$(git rev-parse --short HEAD)
          cd "$RUNNER_TEMP"
          git init -q shots && cd shots
          mkdir android && cp "$SRC"/*.png android/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b screenshots
          git add android
          git commit -q -m "Screenshots of the app from $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
