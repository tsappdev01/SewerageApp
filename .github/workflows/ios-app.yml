# Builds DIP Field Service for iOS (iPhone and iPad) on a Mac, runs it in the iPhone and iPad simulators
# with the demo data and takes screenshots. The screenshots are attached to the run and pushed to the
# branch "screenshots-ios". A signed build for real devices needs an Apple Developer account
# (ios/README.md); until then this proves the app builds and runs.
name: iOS app

on:
  push:
    paths:
      - 'android/**'
      - '!android/**/*.md'
      - 'ios/**'
      - '.github/workflows/ios-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin/Native cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for the simulator (demo data, no lock, so the screenshots show the screens)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project DIPFieldService.xcodeproj -scheme DIPFieldService -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            MR_USE_FAKE_DATA=YES MR_DEVICE_LOCK=NO MR_READER_LOGIN=rashid@dip.example \
            build > xcodebuild.log 2>&1 || { grep -nE "error|e: |FAILURE|What went wrong" xcodebuild.log | tail -n 60; tail -n 80 xcodebuild.log; exit 1; }
          test -d build/Build/Products/Debug-iphonesimulator/DIPFieldService.app

      - name: Run on iPhone and iPad simulators and take screenshots
        run: |
          APP=ios/build/Build/Products/Debug-iphonesimulator/DIPFieldService.app
          mkdir -p ios-shots
          pick() { xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid']+'|'+x['name'] for r in sorted(d,reverse=True) for x in d[r] if x['name'].startswith('$1')))"; }
          for kind in iPhone iPad; do
            IFS='|' read -r UDID NAME <<< "$(pick $kind)"
            echo "$kind: $NAME ($UDID)"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl privacy "$UDID" grant all com.meterreading.reader || true
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl launch "$UDID" com.meterreading.reader
            sleep 25
            xcrun simctl io "$UDID" screenshot "ios-shots/${kind}-home.png"
            xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "DIPFieldService"' --style compact | tail -n 40 || true
            xcrun simctl shutdown "$UDID"
          done
          ls -la ios-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios-shots/*.png
          if-no-files-found: warn

      - name: Push to the screenshots-ios branch
        run: |
          SRC="$PWD/ios-shots"
          SHA=$(git rev-parse --short HEAD)
          cd "$RUNNER_TEMP"
          git init -q shots && cd shots
          mkdir ios && cp "$SRC"/*.png ios/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b screenshots-ios
          git add ios
          git commit -q -m "iOS screenshots from $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-ios
